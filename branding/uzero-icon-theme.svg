       read from the uzero.app site tokens. Fallbacks are the brand hexes. -->
  <defs>
    <style>
      :root {
        --uz-orange: #D9541E;
        --uz-cream: #F2E4C8;
        --uz-ink: #231F1B;
        --uz-shadow: #5A1E02;
        --uz-split: #9A5A24;
      }
      .plate { fill: var(--orange, var(--uz-orange)); }
      .card { fill: var(--cream, var(--uz-cream)); }
      .card-ink { fill: var(--ink-c, var(--uz-ink)); }
      .card-shadow { fill: var(--uz-shadow); opacity: .55; }
      .card-split { fill: var(--uz-split); }
    </style>
