name: CI

on:
  push:
    branches: [main, safari]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub-hosted on purpose: this repo will go public, and the org's
    # self-hosted runner must only serve private repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test
      - name: Build every browser
        run: |
          pnpm build
          pnpm build:firefox
          pnpm exec wxt build -b edge
