name: Release

# Push a vX.Y.Z tag (scripts/release.sh does this) to publish a GitHub release
# with store-ready zips for Chrome, Edge and Firefox, then submit them to the stores.
# Tags with a hyphen (v1.2.0-beta.1) become prereleases and skip the stores.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must match package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Zip every browser
        run: |
          pnpm zip
          pnpm zip:firefox
          pnpm exec wxt zip -b edge
          cd .output && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > .output/notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "Uzero $GITHUB_REF_NAME" --notes-file .output/notes.md \
            .output/*.zip .output/SHA256SUMS.txt

  submit:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/submit.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
